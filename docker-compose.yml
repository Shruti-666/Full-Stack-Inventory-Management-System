version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: inventory_postgres

    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: inventory_backend

    ports:
      - "8000:8000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres123

    depends_on:
      - postgres

    restart: always

  frontend:
    build: ./frontend

    container_name: inventory_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: always

volumes:
  postgres_data: